<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiber Graphics — Animirani background</title>
<style>
  :root{
    --bg-0:#060d18;
    --bg-1:#0a1a2e;
    --line:#39e0ff;
    --line-dim:rgba(57,224,255,.30);
    --laser:#ff5236;
    --ink:#ff2fa8;
    --ink2:#ffd23f;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{ background:var(--bg-0); overflow:hidden; }

  /* Ceo ekran = animirani background */
  .bg{
    position:fixed; inset:0;
    overflow:hidden;
    background:radial-gradient(1200px 900px at 50% 45%, var(--bg-1), var(--bg-0) 72%);
  }

  /* Blueprint mreža */
  .grid{
    position:absolute; inset:0;
    background-image:
      linear-gradient(var(--line-dim) 1px, transparent 1px),
      linear-gradient(90deg, var(--line-dim) 1px, transparent 1px);
    background-size:48px 48px;
    opacity:.12;
    mask-image:radial-gradient(ellipse 85% 85% at 50% 50%, black 35%, transparent 92%);
  }

  /* Mašine centrirane */
  .scene{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
  }
  .scene svg{
    width:min(90vw,1000px);
    height:auto;
    filter:drop-shadow(0 0 14px rgba(57,224,255,.18));
  }

  /* suptilna vinjeta po ivicama */
  .vignette{
    position:absolute; inset:0;
    background:radial-gradient(ellipse at center, transparent 55%, rgba(6,13,24,.7) 100%);
    pointer-events:none;
  }

  /* ---------- animacije mašina ---------- */
  .cnc-gantry{ animation:gantryY 7s ease-in-out infinite; transform-box:fill-box; }
  .cnc-head{   animation:headX 3.2s ease-in-out infinite; transform-box:fill-box; }
  .laser-dot{  animation:laserPulse 3.2s ease-in-out infinite; transform-origin:center; }
  .engrave{ stroke-dasharray:520; stroke-dashoffset:520; animation:draw 7s ease-in-out infinite; }
  .print-head{ animation:printX 4s ease-in-out infinite; transform-box:fill-box; }
  .print-row{ animation:printReveal 8s linear infinite; }
  .print-row.r2{ animation-delay:1s; }
  .print-row.r3{ animation-delay:2s; }
  .spark{ animation:spark 3.2s ease-in-out infinite; transform-origin:center; }

  @keyframes gantryY{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(38px);} }
  @keyframes headX{ 0%,100%{transform:translateX(-70px);} 50%{transform:translateX(70px);} }
  @keyframes laserPulse{ 0%,100%{opacity:.35; r:3;} 50%{opacity:1; r:5;} }
  @keyframes spark{ 0%,100%{opacity:0;} 45%{opacity:0;} 50%{opacity:1;} 55%{opacity:0;} }
  @keyframes draw{
    0%{stroke-dashoffset:520;}
    60%{stroke-dashoffset:0;}
    80%{stroke-dashoffset:0; opacity:1;}
    100%{stroke-dashoffset:0; opacity:0;}
  }
  @keyframes printX{ 0%,100%{transform:translateX(0);} 50%{transform:translateX(150px);} }
  @keyframes printReveal{
    0%{transform:scaleX(0); opacity:0;}
    10%{opacity:1;}
    45%{transform:scaleX(1);}
    90%{transform:scaleX(1); opacity:1;}
    100%{transform:scaleX(1); opacity:0;}
  }

  @media (prefers-reduced-motion: reduce){
    .cnc-gantry,.cnc-head,.laser-dot,.engrave,.print-head,.print-row,.spark{ animation:none; }
    .engrave{ stroke-dashoffset:0; }
  }
</style>
</head>
<body>
  <div class="bg">
    <div class="grid"></div>

    <div class="scene">
      <svg viewBox="0 0 760 520" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#39e0ff" stop-opacity=".9"/>
            <stop offset="1" stop-color="#39e0ff" stop-opacity="0"/>
          </linearGradient>
        </defs>

        <!-- ===== CNC / LASER MAŠINA ===== -->
        <g stroke="#39e0ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="120" y="40" width="520" height="210" rx="8" stroke-opacity=".55"/>
          <rect x="150" y="150" width="460" height="80" rx="4" stroke-opacity=".7"/>
          <path class="engrave" d="M200 210 q40 -40 80 0 t80 0 t80 0 t80 0 t80 0"
                stroke="#ff5236" stroke-width="2.5" fill="none"/>
          <line x1="150" y1="55" x2="150" y2="150" stroke-opacity=".4"/>
          <line x1="610" y1="55" x2="610" y2="150" stroke-opacity=".4"/>

          <g class="cnc-gantry">
            <line x1="150" y1="95" x2="610" y2="95" stroke-width="4"/>
            <g class="cnc-head">
              <rect x="360" y="78" width="40" height="34" rx="4" fill="#0a1a2e"/>
              <line x1="380" y1="112" x2="380" y2="140"/>
              <line x1="380" y1="140" x2="380" y2="205" stroke="url(#glow)" stroke-width="4"/>
              <circle class="laser-dot" cx="380" cy="205" r="3" fill="#ff5236"/>
              <g class="spark" stroke="#ffd23f" stroke-width="1.5">
                <line x1="380" y1="205" x2="372" y2="196"/>
                <line x1="380" y1="205" x2="390" y2="197"/>
                <line x1="380" y1="205" x2="386" y2="214"/>
              </g>
            </g>
          </g>
        </g>

        <!-- ===== UV ŠTAMPAČ ===== -->
        <g stroke="#39e0ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="150" y="300" width="440" height="180" rx="10" stroke-opacity=".55"/>
          <rect x="185" y="360" width="370" height="90" rx="4" fill="#08131f" stroke-opacity=".7"/>
          <g>
            <rect class="print-row"    x="200" y="375" width="330" height="9" rx="2" fill="#ff2fa8" stroke="none" style="transform-origin:200px 379px"/>
            <rect class="print-row r2" x="200" y="397" width="330" height="9" rx="2" fill="#39e0ff" stroke="none" style="transform-origin:200px 401px"/>
            <rect class="print-row r3" x="200" y="419" width="330" height="9" rx="2" fill="#ffd23f" stroke="none" style="transform-origin:200px 423px"/>
          </g>
          <line x1="185" y1="330" x2="555" y2="330" stroke-width="3" stroke-opacity=".6"/>
          <g class="print-head">
            <rect x="196" y="318" width="34" height="26" rx="4" fill="#0a1a2e"/>
            <line x1="213" y1="344" x2="213" y2="360" stroke="#ff2fa8"/>
            <circle cx="213" cy="360" r="2.5" fill="#ff2fa8" stroke="none"/>
          </g>
        </g>
      </svg>
    </div>

    <div class="vignette"></div>
  </div>
</body>
</html>
