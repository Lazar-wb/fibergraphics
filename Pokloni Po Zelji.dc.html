<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Pokloni po želji | Fiber Graphics</title>
<meta name="description" content="Personalizovani pokloni sa gravurom — za rođendane, venčanja, firme i posebne prilike.">
<meta property="og:title" content="Pokloni po želji | Fiber Graphics">
<meta property="og:description" content="Personalizovani pokloni sa gravurom — za rođendane, venčanja, firme i posebne prilike.">
<meta property="og:type" content="website">
<link rel="icon" href="assets/logo-mali.webp" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Montserrat:wght@600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; background:#f3f4f6; color:#1f2937; -webkit-font-smoothing:antialiased; }
  a { color:#ff3737; text-decoration:none; }
  a:hover { color:#e11d1d; }
  ::selection { background:#ff3737; color:#f3f4f6; }
  .fg-reveal { opacity: 0; transform: translateY(48px); transition: opacity 0.8s cubic-bezier(0.4,0,0.2,1), transform 0.8s cubic-bezier(0.4,0,0.2,1); }
  .fg-reveal.fg-in { opacity: 1; transform: none; }
  @media (max-width:820px) { .fg-logo-big { display:none !important; } .fg-logo-mali { display:block !important; } }
  .fg-navleft { display:flex; align-items:center; gap:14px; }
  .fg-navright { display:flex; align-items:center; gap:30px; }
  .fg-navlinks { display:flex; align-items:center; gap:30px; }
  .fg-burger { display:none; background:none; border:none; cursor:pointer; padding:6px; }
  @keyframes fg-navitem { from { opacity:0; transform:translateX(16px); } to { opacity:1; transform:translateX(0); } }
  @media (max-width:820px) {
    .fg-burger { display:flex; }
    .fg-navlinks { position:absolute; top:100%; left:0; right:0; background:#000; flex-direction:column; align-items:flex-start; padding:20px 24px; gap:22px; box-shadow:0 18px 40px rgba(0,0,0,0.5); }
    .fg-navlinks:not(.fg-open) { display:none; }
    .fg-navlinks.fg-open > * { animation: fg-navitem 0.35s ease both; }
    .fg-navlinks.fg-open > *:nth-child(1){animation-delay:0.05s}
    .fg-navlinks.fg-open > *:nth-child(2){animation-delay:0.13s}
    .fg-navlinks.fg-open > *:nth-child(3){animation-delay:0.21s}
    .fg-navlinks.fg-open > *:nth-child(4){animation-delay:0.29s}
    .fg-navlinks.fg-open > *:nth-child(5){animation-delay:0.37s}
    .fg-svcdrop { left:0 !important; transform:none !important; padding-top:12px !important; z-index:40; }
    .fg-navlinks.fg-svc-open > *:not(:nth-child(2)) { display:none; }
  }
</style>
</helmet>
<div style="background:#f3f4f6;color:#1f2937;overflow-x:clip;">
  <header style="position:sticky;top:0;z-index:50;background:#000000;">
    <nav style="position:relative;max-width:1240px;margin:0 auto;padding:18px 32px;display:flex;align-items:center;justify-content:space-between;gap:24px;">
      <div class="fg-navleft">
        <button class="fg-burger" onClick="{{ toggleMenu }}" aria-label="Meni"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 7h16M4 12h16M4 17h16" stroke="#e5e7eb" stroke-width="2" stroke-linecap="round"/></svg></button>
        <a href="Fiber Graphics.dc.html" style="display:flex;align-items:center;">
          <img fetchpriority="high" class="fg-logo-big" src="assets/logo.svg" alt="Fiber Graphics" style="height:40px;width:auto;display:block;"><img fetchpriority="high" class="fg-logo-mali" src="assets/logo-mali.webp" alt="Fiber Graphics" style="height:38px;width:auto;border-radius:8px;display:none;">
        </a>
      </div>
      <div class="fg-navright">
      <div class="fg-navlinks {{ menuClass }}" style="font-family:'Montserrat',sans-serif;font-weight:700;font-size:14px;letter-spacing:0.08em;text-transform:uppercase;">
        <a href="Fiber Graphics.dc.html" style="color:#e5e7eb;transition:color 0.22s,transform 0.22s;" style-hover="color:#ff3737;transform:translateY(-2px);">Početna</a>
        <div style="position:relative;" onMouseEnter="{{ openSvc }}" onMouseLeave="{{ closeSvc }}">
          <a href="Fiber Graphics.dc.html#usluge" onClick="{{ toggleSvc }}" style="color:#e5e7eb;transition:color 0.22s;display:inline-flex;align-items:center;gap:6px;" style-hover="color:#ff3737;">Usluge <span style="display:flex;transform:rotate({{ svcRot }});transition:transform 0.22s;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 9l6 6 6-6" stroke="#ff3737" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span></a>
          <div class="fg-svcdrop" style="position:absolute;top:100%;left:50%;transform:translateX(-50%) translateY({{ svcShift }});padding-top:16px;opacity:{{ svcOpacity }};pointer-events:{{ svcPointer }};transition:opacity 0.2s,transform 0.2s;z-index:30;">
            <div style="background:#ffffff;border:1px solid rgba(255,55,55,0.28);border-radius:12px;min-width:210px;padding:8px;box-shadow:0 18px 44px rgba(31,41,55,0.16);display:flex;flex-direction:column;">
              <sc-for list="{{ svcLinks }}" as="l" hint-placeholder-count="6">
                <a href="{{ l.href }}" style="font-family:'Montserrat',sans-serif;font-weight:600;font-size:12px;letter-spacing:0.04em;text-transform:uppercase;color:#374151;padding:11px 14px;border-radius:8px;opacity:{{ l.op }};transform:translateX({{ l.x }});transition:opacity 0.35s ease {{ l.delay }},transform 0.35s ease {{ l.delay }},background 0.18s,color 0.18s;" style-hover="background:rgba(255,55,55,0.12);color:#ff3737;">{{ l.label }}</a>
              </sc-for>
            </div>
          </div>
        </div>
        <a href="Galerija.dc.html" style="color:#e5e7eb;transition:color 0.22s,transform 0.22s;" style-hover="color:#ff3737;transform:translateY(-2px);">Galerija</a>
        <a href="Fiber Graphics.dc.html#kontakt" style="color:#e5e7eb;transition:color 0.22s,transform 0.22s;" style-hover="color:#ff3737;transform:translateY(-2px);">Kontakt</a>
        <a href="Korpa.dc.html" style="border:1px solid #ff3737;color:#ff3737;padding:10px 18px;border-radius:15px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;transition:background 0.22s,color 0.22s,transform 0.22s,box-shadow 0.22s;" style-hover="background:#ff3737;color:#f3f4f6;transform:translateY(-2px);box-shadow:0 8px 20px rgba(255,55,55,0.28);">Poruči</a>
      </div>
        <a href="Korpa.dc.html" aria-label="Korpa" style="position:relative;display:flex;align-items:center;justify-content:center;transition:transform 0.22s;" style-hover="transform:translateY(-2px);"><img src="assets/cart.webp" alt="Korpa" style="width:16px;height:16px;image-rendering:pixelated;filter:brightness(0) invert(1);display:block;"><sc-if value="{{ hasCartCount }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;top:-9px;right:-11px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:#ff3737;color:#ffffff;font-family:'Montserrat',sans-serif;font-weight:700;font-size:10px;line-height:17px;text-align:center;box-shadow:0 0 0 2px #000000;">{{ cartCount }}</span></sc-if></a>
      </div>
    </nav>
  </header>

  <section style="min-height:calc(100vh - 80px);display:flex;align-items:center;justify-content:center;padding:40px 24px;background:#f3f4f6;">
    <h1 style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(36px,7vw,72px);letter-spacing:-0.01em;color:#1f2937;text-transform:uppercase;text-align:center;">Uskoro u ponudi</h1>
  </section>
</div>

<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#ff3737"/><text x="50" y="63" font-family="sans-serif" font-size="34" font-weight="700" fill="#fff" text-anchor="middle">FG</text></svg></template></x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { cartCount: 0, svcOpen: false, menuOpen: false };
  componentDidMount() {
    this._syncCart = () => { try { const c = JSON.parse(localStorage.getItem("fg-cart") || "[]"); this.setState({ cartCount: Array.isArray(c) ? c.length : 0 }); } catch (e) {} };
    this._syncCart(); window.addEventListener("storage", this._syncCart); window.addEventListener("fg-cart-change", this._syncCart);
    this._revealT = setTimeout(() => {
      const secs = Array.from(document.querySelectorAll('section, footer')).filter(el => !(el.id || '').startsWith('hero'));
      if (!secs.length || !('IntersectionObserver' in window)) return;
      secs.forEach(el => el.classList.add('fg-reveal'));
      this._revealIo = new IntersectionObserver((entries) => {
        entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('fg-in'); else e.target.classList.remove('fg-in'); });
      }, { threshold: 0.12 });
      secs.forEach(el => this._revealIo.observe(el));
    }, 100);
  }
  componentWillUnmount() { clearTimeout(this._revealT); if (this._revealIo) this._revealIo.disconnect(); }
  renderVals() {
    const s = this.state;
    return {
      cartCount: s.cartCount, hasCartCount: s.cartCount > 0,
      openSvc: () => this.setState({ svcOpen: true }),
      toggleSvc: (e) => { if (window.matchMedia("(max-width:820px)").matches) { e.preventDefault(); this.setState(st => ({ svcOpen: !st.svcOpen })); } },
      menuClass: (s.menuOpen ? "fg-open" : "") + (s.svcOpen ? " fg-svc-open" : ""),
      toggleMenu: () => this.setState(st => ({ menuOpen: !st.menuOpen })),
      closeSvc: () => this.setState({ svcOpen: false, menuOpen: false }),
      svcOpacity: s.svcOpen ? 1 : 0,
      svcPointer: s.svcOpen ? "auto" : "none",
      svcShift: s.svcOpen ? "0px" : "-6px",
      svcRot: s.svcOpen ? "180deg" : "0deg",
      svcLinks: [
        { label: "Reklamna štampa", href: "Reklamni Materijal.dc.html" },
        { label: "Brojevi za kuću", href: "Brojevi Za Kuce.dc.html" },
        { label: "Gravura metala", href: "UV Gravura.dc.html" },
        { label: "Pokloni po želji", href: "Pokloni Po Zelji.dc.html" },
        { label: "Trofejne plakete", href: "Trofejne Plakete.dc.html" },
        { label: "Asortiman za kafiće", href: "Asortiman Za Kafice.dc.html" },
      ].map((l, i) => ({
        ...l,
        op: s.svcOpen ? 1 : 0,
        x: s.svcOpen ? "0px" : "-12px",
        delay: s.svcOpen ? (i * 0.1) + "s" : "0s",
      })),
      tiles: ["rođendani", "godišnjice", "firme", "venčanja", "praznici", "krštenja", "sport", "posebno"],
      steps: [
        { n: "01", t: "Pošaljite ideju", d: "Opišite priliku i šta zamišljate — mi predlažemo rešenje." },
        { n: "02", t: "Dizajn i izrada", d: "Kreiramo dizajn i izrađujemo poklon laserskom preciznošću." },
        { n: "03", t: "Preuzimanje", d: "Preuzmite lično ili šaljemo brzom poštom širom Srbije." },
      ],
    };
  }
}
</script>
</body>
</html>
